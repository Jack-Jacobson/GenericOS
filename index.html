<!DOCTYPE html>
<html>
<head>
    <title>OS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #desktop {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            z-index: 0;
        }
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 20, 20, 0.489);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 10000;
            transition: background 0.15s ease;
        }
        #taskbar.solid {
            background: rgb(20, 20, 20);
        }
        #clock {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
        }
        #os-text {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
        }
        #notepad-icon img {
            width: 60px;
            height: 60px;
            display: block;
            margin: 0 auto 5px auto;
            z-index: 10;
        }
        #notepad-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            padding: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: transparent;
            border-radius: 8px;
            border: 1px solid transparent;;
            transition: background 0.15s ease, border 0.15s ease;
        }
        body:not(.dragging) #notepad-icon:hover{
            background: rgba(54, 52, 52, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #test-window {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            height: 150px;
            background: rgba(30,30,30);
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-family: sans-serif;
            cursor: grab;
            user-select: none;
            display: none;
            z-index: 100;
        }
        #test-window.maximized {
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }
        #controls button {
            background: transparent;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        #titleBar {
            height: 30px;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            cursor: grab;
        }
        #controls button{
            background: transparent;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        #contents {
            padding: 10px;
            height: calc(100% - 30px);
        }
    </style>
</head>
<body>
    <div id="desktop">

        <div id="test-window"> 
            <div id="titleBar">
                <div id="title">Test Window</div>
                
                <div id="controls">
                    <button id="min-btn">–</button>
                    <button id="max-btn">□</button>
                    <button id="close-btn">✕</button>
                </div>
            </div>
        </div>

        <div id="notepad-icon">
            <img src="assets/notepad-icon.png" />
            <div>Notepad</div>
        </div>


        <div id="taskbar">
            <div id="os-text">GenericOS</div>
            <div id="clock"></div>
        </div>
    </div>
    <script>
        //wallpaper
        document.getElementById("desktop").style.backgroundImage = "url('assets/wallpaper.jpeg')";
    
        //clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            let ampm = "AM";
            if(hours>=12){
                hours -= 12;
                ampm = "PM";
            } 

            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        
        }

        updateClock();
        setInterval(updateClock, 1000);

        //draggable window
        const testWindow = document.getElementById("test-window");
        const notepadIcon = document.getElementById("notepad-icon");

        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let globalDragging = false;

        notepadIcon.addEventListener("click", () => {
            testWindow.style.display = "block";
        });

        const titleBar = document.getElementById("titleBar");
        if (titleBar) {
          titleBar.addEventListener("mousedown", (e) => {
            if (isMaximized) return;
            isDragging = true;
            globalDragging = true;
            offsetX = e.clientX - testWindow.offsetLeft;
            offsetY = e.clientY - testWindow.offsetTop;
            testWindow.style.cursor = "grabbing";
          });
        }

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;

            const maxX = window.innerWidth - testWindow.offsetWidth;
            const maxY = window.innerHeight - testWindow.offsetHeight;

            const nextX = e.clientX - offsetX;
            const nextY = e.clientY - offsetY;

            const clampedX = Math.max(0, Math.min(nextX, maxX));
            const clampedY = Math.max(0, Math.min(nextY, maxY));

            testWindow.style.left = `${clampedX}px`;
            testWindow.style.top = `${clampedY}px`;

        
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
            globalDragging = false;
            testWindow.style.cursor = "grab";
        });

        //prevent icon highlight when dragging
        document.addEventListener("mousedown", () =>{
            document.body.classList.add("dragging");
        });
        document.addEventListener("mouseup", () =>{
            document.body.classList.remove("dragging");
        });

        //window button control
        const win = document.getElementById("test-window");

        const minBtn = document.getElementById("min-btn");
        const maxBtn = document.getElementById("max-btn");
        const closeBtn = document.getElementById("close-btn");

        let isMaximized = false;
        let prevState = {
            width: win.style.width,
            height: win.style.height,
            left: win.style.left,
            top: win.style.top
        };

        closeBtn.addEventListener("click", () => {
            win.style.display = "none";
        });
        minBtn.addEventListener("click", () => {
            win.style.display = "none";
        });
        maxBtn.addEventListener("click", () => {
            if (!isMaximized) {
                prevState = {
                    width: win.style.width,
                    height: win.style.height,
                    left: win.style.left,
                    top: win.style.top
                };
                win.style.width = "100vw";
                win.style.height = "calc(100vh - 50px)";
                win.style.left = "0";
                win.style.top = "0";

                win.classList.add("maximized");

            } else {
                win.style.width = prevState.width;
                win.style.height = prevState.height;
                win.style.left = prevState.left;
                win.style.top = prevState.top;

                win.classList.remove("maximized");
            }
            isMaximized = !isMaximized;
        });

    </script>
</body>
</html>
