<!DOCTYPE html>
<html>
<head>
    <title>OS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #desktop {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            z-index: 0;
        }
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 20, 20, 0.489);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 10000;
        }
        #clock {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
        }
        #os-text {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
        }
        #notepad-icon img {
            width: 60px;
            height: 60px;
            display: block;
            margin: 0 auto 5px auto;
            z-index: 10;
        }
        #notepad-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            padding: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: transparent;
            border-radius: 8px;
            border: 1px solid transparent;;
            transition: background 0.15s ease, border 0.15s ease;
        }
        body:not(.dragging) #notepad-icon:hover{
            background: rgba(54, 52, 52, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #test-window {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            height: 150px;
            background: rgba(30,30,30,0.9);
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-family: sans-serif;
            cursor: grab;
            user-select: none;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="desktop">

        <div id="test-window"> 
            drag me
        </div>

        <div id="notepad-icon">
            <img src="assets/notepad-icon.png" />
            <div>Notepad</div>
        </div>


        <div id="taskbar">
            <div id="os-text">GenericOS</div>
            <div id="clock"></div>
        </div>
    </div>
    <script>
        //wallpaper
        document.getElementById("desktop").style.backgroundImage = "url('assets/wallpaper.jpeg')";
    
        //clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            let ampm = "AM";
            if(hours>=12){
                hours -= 12;
                ampm = "PM";
            } 

            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        
        }

        updateClock();
        setInterval(updateClock, 1000);

        //draggable window
        const testWindow = document.getElementById("test-window");
        const notepadIcon = document.getElementById("notepad-icon");

        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let globalDragging = false;

        notepadIcon.addEventListener("click", () => {
            testWindow.style.display = "block";
        });

        testWindow.addEventListener("mousedown", (e) => {
            isDragging = true;
            globalDragging = true;
            offsetX = e.clientX - testWindow.offsetLeft;
            offsetY = e.clientY - testWindow.offsetTop;
            testWindow.style.cursor = "grabbing";
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;

            const maxX = window.innerWidth - testWindow.offsetWidth;
            const maxY = window.innerHeight - testWindow.offsetHeight;

            const nextX = e.clientX - offsetX;
            const nextY = e.clientY - offsetY;

            const clampedX = Math.max(0, Math.min(nextX, maxX));
            const clampedY = Math.max(0, Math.min(nextY, maxY));

            testWindow.style.left = `${clampedX}px`;
            testWindow.style.top = `${clampedY}px`;

        
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
            globalDragging = false;
            testWindow.style.cursor = "grab";
        });

        //prevent icon highlight when dragging
        document.addEventListener("mousedown", () =>{
            document.body.classList.add("dragging");
        });
        document.addEventListener("mouseup", () =>{
            document.body.classList.remove("dragging");
        });

    </script>
</body>
</html>
