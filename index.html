<!DOCTYPE html>
<html>
<head>
    <title>GenericOS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #desktop {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            z-index: 0;
        }
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 20, 20, 0.489);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 10000;
            transition: background 0.15s ease;
        }
        #taskbar.solid {
            background: rgb(20, 20, 20);
        }
        #clock {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            margin-left: auto;
            user-select: none;
        }
        #os-text {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            user-select: none;
        }
        #notepad-icon img {
            width: 60px;
            height: 60px;
            display: block;
            margin: 0 auto 5px auto;
            z-index: 10;
        }
        #notepad-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            padding: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: transparent;
            border-radius: 8px;
            border: 1px solid transparent;;
            transition: background 0.15s ease, border 0.15s ease;
        }
        body:not(.dragging) #notepad-icon:hover{
            background: rgba(54, 52, 52, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #terminal-icon {
            position: absolute;
            top: 120px;
            left:   20px;
            width: 80px;
            padding: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: transparent;
            border-radius: 8px;
            border: 1px solid transparent;;
            transition: background 0.15s ease, border 0.15s ease;
        }
        body:not(.dragging) #terminal-icon:hover{
            background: rgba(54, 52, 52, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #terminal-icon img{
            width: 60px;
            height: 60px;
            display: block;
            margin: 0 auto 5px auto;
            z-index: 10;
        }
        #controls {
            display: flex;
            gap: 2px;
        }
        #notepad-window {
            position: absolute;
            top: 50px;
            left: 100px;
            width: 600px;
            height: 400px;
            background: rgba(30,30,30);
            color: white;
            border-radius: 8px;
            padding: 0;
            font-family: sans-serif;
            user-select: none;
            display: none;
            z-index: 100;
            box-sizing: border-box;
            flex-direction: column;
        }
        #notepad-window.maximized {
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 50px);
            border-radius: 0;
            cursor: default;
        }
        #notepad-window.maximized #titleBar {
            cursor: default;
        }
        #notepad-window.maximized #controls button{
            cursor: pointer;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        #notepad-titleBar {
            height: 30px;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 8px;
            padding-right: 8px;
            cursor: grab;
            box-sizing: border-box;
        }
        #controls button{
            background: transparent;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        #notepad-content {
            padding: 10px;
            height: calc(100% - 30px);
            background: rgba(50,50,50);
            flex: 1;
            overflow: auto;
        }
        #notepad-textarea{
            flex: 1;
            background: rgba(50, 50, 50);
            color: white;
            border: none;
            padding: 10px;
            font-family: sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        #notepad-textarea:focus {
            background: rgba(60, 60, 60);
        }
        #taskbar-seperator{
            width: 2px;
            height: 30px;
            background: rgba(255, 255, 255, 0.9);
            margin: 0 15px;
        }
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('assets/loading-screen.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
            animation: bootFadeOut 3.5s ease-out forwards;
            z-index: 9999899;
            user-select: none;
        }
        @keyframes bootFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0;}
        }
        #terminal-window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 600px;
            height: 400px;
            background: rgba(0,0,0,0.95);
            color: #00ff00;
            border-radius: 8px;
            padding: 0;
            font-family: monospace;
            user-select: none;
            display: none;
            z-index: 100;
            box-sizing: border-box;
            flex-direction: column;
        }
        #terminal-window.maximized {
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 50px);
            border-radius: 0;
            cursor: default;
        }
        #terminal-titleBar {
            height: 30px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 8px;
            padding-right: 8px;
            cursor: grab;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2)
        }
        #terminal-controls{
            display: flex;
            gap: 2px;
        }
        #terminal-controls button{
            background: transparent;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
        }
        #terminal-controls button:hover{
            background: rgba(0, 255, 0, 0.1);
            border-radius: 4px;
        }
        #terminal-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            overflow-x: hidden;
        }
        #terminal-line {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            width: 100%;
        }
        #terminal-prompt {
            color: #00ff00;
            font-family: monospace;
            white-space: nowrap;
        }
        #terminal-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: monospace;
            font-size: 14px;
            outline: none;
            user-select: text;
        }
        #terminal-output {
            margin: 0;
            padding: 0;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }
        #taskbar-seperator-2,
        #taskbar-seperator-3 {
            width: 2px;
            height: 30px;
            background: rgba(255,255,255,0.9);
            margin: 0 15px;
        }
        #power-button {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #power-button img{
            width: 24px;
            height: 24px;
        }
        #power-button:hover{
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        #power-menu {
            position: absolute;
            bottom: 60px;
            right: 15px;
            background: rgba(20,20,20,0.489);
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 180px;
            display: none;
            flex-direction: column;
            backdrop-filter: blur(10px);
            border-radius: 8px;
            overflow: hidden;
            z-index: 10001
        }
        .power-option {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            padding: 12px 16px;
            padding-left: 20px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .power-option:hover {
            background: rgba(255,255,255,0.8);
        }
        .power-divider{
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="desktop">
        <div id="boot-screen"> </div>
        <div id="notepad-window"> 
            <div id="notepad-titleBar">
                <div id="notepad-title">Notepad</div>
                
                <div id="controls">
                    <button id="min-btn">–</button>
                    <button id="max-btn">□</button>
                    <button id="close-btn">✕</button>
                </div>
            </div>
            <textarea id="notepad-textarea" placeholder="Type here!"></textarea>
        </div>

        <div id="notepad-icon">
            <img src="assets/notepad-icon.png" />
            <div>Notepad</div>
        </div>
        <div id = "terminal-window">
            <div id="terminal-titleBar">
                <div id="terminal-title">Terminal</div>

                <div id="terminal-controls">
                    <button id="terminal-min-btn">–</button>
                    <button id="terminal-max-btn">□</button>
                    <button id="terminal-close-btn">✕</button>
                </div>
            </div>
            <div id="terminal-content">
                <div id="terminal-output"></div>
                <div id="terminal-line">
                    <span id="terminal-prompt">user@GenericOS~:$ </span>
                    <input id="terminal-input" autocomplete=""off" placeholder=" Type a command. Type 'help' for help."/>
                </div>
            </div>
        </div>
        <div id="terminal-icon">
            <img src="assets/terminal-icon.png" />
            <div>Terminal</div>
        </div>
        <div id="taskbar">
            <div id="os-text">GenericOS</div>
            <div id="taskbar-seperator"></div>
            <div id="taskbar-items"></div>
            <div id="clock"></div>
            <div id="taskbar-seperator-2"></div>
            <button id="power-button">
                <img src="assets/power-button-icon.png">
            </button>
            <div id="power-menu">
                <div class = "power-option">Power Off</div>
                <div class= "power-divider"></div>
                <div class= "power-option">Restart</div>
            </div>
            <div id="taskbar-seperator-3"></div>
        </div>
    </div>
    <script src="commands.js"></script>
    <script>
        //wallpaper
        document.getElementById("desktop").style.backgroundImage = "url('assets/wallpaper.jpeg')";
    
        //Maximize taskbar fix
        const taskbar = document.getElementById("taskbar");

        //clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            let ampm = "AM";
            if(hours>=12){
                hours -= 12;
                ampm = "PM";
            } 
            if(hours == 0){
                hours = 12;
            }

            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        
        }

        updateClock();
        setInterval(updateClock, 1000);

        //draggable window
        const notepadWindow = document.getElementById("notepad-window");
        const notepadIcon = document.getElementById("notepad-icon");

        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let globalDragging = false;

        notepadIcon.addEventListener("click", () => {
            notepadWindow.style.width = "600px";
            notepadWindow.style.height = "400px";
            notepadWindow.style.top = "50px";
            notepadWindow.style.left = "100px";
            notepadWindow.classList.remove("maximized");
            isMaximized = false;
            notepadWindow.style.display = "flex";
            addToTaskbar();
        });

        const titleBar = document.getElementById("notepad-titleBar");
        if (titleBar) {
          titleBar.addEventListener("mousedown", (e) => {
            if (isMaximized) return;
            isDragging = true;
            globalDragging = true;
            offsetX = e.clientX - notepadWindow.offsetLeft;
            offsetY = e.clientY - notepadWindow.offsetTop;
            notepadWindow.style.cursor = "grabbing";
          });
        }

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;

            let activeWindow = notepadWindow;
            if(terminalWindow.style.cursor === "grabbing"){
                activeWindow = terminalWindow;
            }

            const maxX = window.innerWidth - activeWindow.offsetWidth;
            const maxY = window.innerHeight - activeWindow.offsetHeight;

            const nextX = e.clientX - offsetX;
            const nextY = e.clientY - offsetY;

            const clampedX = Math.max(0, Math.min(nextX, maxX));
            const clampedY = Math.max(0, Math.min(nextY, maxY));

            activeWindow.style.left = `${clampedX}px`;
            activeWindow.style.top = `${clampedY}px`;

        
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
            globalDragging = false;
           notepadWindow.style.cursor = "";
           terminalWindow.style.cursor = "";
        });

        //prevent icon highlight when dragging
        document.addEventListener("mousedown", () =>{
            document.body.classList.add("dragging");
        });
        document.addEventListener("mouseup", () =>{
            document.body.classList.remove("dragging");
        });

        //window button control
        const win = document.getElementById("notepad-window");

        const minBtn = document.getElementById("min-btn");
        const maxBtn = document.getElementById("max-btn");
        const closeBtn = document.getElementById("close-btn");

        let isMaximized = false;
        let prevState = {
            width: win.style.width,
            height: win.style.height,
            left: win.style.left,
            top: win.style.top
        };

        closeBtn.addEventListener("click", () => {
            if(isMaximized){
                taskbar.classList.remove("solid");
                isMaximized = false;
            }
            notepadWindow.style.display = "none";
            removeFromTaskbar();
        });
        minBtn.addEventListener("click", () => {
            notepadWindow.style.display = "none";
            if(!document.getElementById("taskbar-notepad")) addToTaskbar();
        });
        maxBtn.addEventListener("click", () => {
            if (!isMaximized) {
                prevState = {
                    width: notepadWindow.style.width,
                    height: notepadWindow.style.height,
                    left: notepadWindow.style.left,
                    top: notepadWindow.style.top
                };
                notepadWindow.style.width = "100vw";
                notepadWindow.style.height = "calc(100vh - 50px)";
                notepadWindow.style.left = "0";
                notepadWindow.style.top = "0";

                notepadWindow.classList.add("maximized");
                taskbar.classList.add("solid");

            } else {
                notepadWindow.style.width = prevState.width;
                notepadWindow.style.height = prevState.height;
                notepadWindow.style.left = prevState.left;
                notepadWindow.style.top = prevState.top;

                notepadWindow.classList.remove("maximized");
                taskbar.classList.remove("solid");
            }
            isMaximized = !isMaximized;
        });

        //taskbar icon funcs
        function addToTaskbar() {
            const taskbarItems = document.getElementById("taskbar-items");
            if (document.getElementById("taskbar-notepad")) return; 

            const item = document.createElement("button");
            item.id = "taskbar-notepad";
            item.style.cursor = "pointer";
            item.style.background = "none";
            item.style.border = "none";
            item.style.padding = "0";
            item.style.margin = "0 5px";

            const img = document.createElement("img");
            img.src = "assets/notepad-icon.png";
            img.style.width = "40px";
            img.style.height = "40px";
            
            item.addEventListener("mouseenter", () => {
                item.style.background = "rgba(54, 52, 52, 0.1)";
                item.style.borderRadius = "4px";
                item.style.border = "1px solid rgba(255, 255, 255, 0.2)";
            });

            item.addEventListener("mouseleave", () => {
                item.style.background = "none";
                item.style.borderRadius = "none";
                item.style.border = "none";
            });

            item.addEventListener("click", () => {
                if (notepadWindow.style.display === "none") {
                    notepadWindow.style.display = "flex";
                    if(isMaximized) taskbar.classList.add("solid");
                } else {
                    notepadWindow.style.display = "none";
                    if(isMaximized) taskbar.classList.remove("solid");
                }
            });

            item.appendChild(img);
            taskbarItems.appendChild(item);
        };
        function removeFromTaskbar() {
            const item = document.getElementById("taskbar-notepad");
            if (item) item.remove();
        }

        //boot screen fade out
        setTimeout (() => {
            const bootScreen = document.getElementById("boot-screen");
            if(bootScreen) {
                bootScreen.remove();
            }
        }, 3500);
        
        //terminal window
        const terminalWindow = document.getElementById("terminal-window");
        const terminalIcon = document.getElementById("terminal-icon");
        const terminalTitleBar = document.getElementById("terminal-titleBar");
        const terminalMinBtn = document.getElementById("terminal-min-btn");
        const terminalMaxBtn = document.getElementById("terminal-max-btn");
        const terminalCloseBtn = document.getElementById("terminal-close-btn");
        let terminalMaximized = false;
        let terminalPrevState  = {
            width: terminalWindow.style.width,
            height: terminalWindow.style.height,
            left: terminalWindow.style.left,
            top: terminalWindow.style.top
        }
        
        terminalIcon.addEventListener("click", () => {
            terminalWindow.style.width = "600px";
            terminalWindow.style.height = "400px";
            terminalWindow.style.top = "100px";
            terminalWindow.style.left = "150px";
            terminalWindow.classList.remove("maximized");
            terminalMaximized = false;
            terminalWindow.style.display = "flex";
            addTerminalToTaskbar();
        });

        if(terminalTitleBar){
            terminalTitleBar.addEventListener("mousedown", (e) => {
                if(terminalMaximized) return;
                isDragging= true;
                globalDragging = true;
                offsetX = e.clientX-terminalWindow.offsetLeft;
                offsetY = e.clientY-terminalWindow.offsetTop;
                terminalWindow.style.cursor="grabbing";
            });
        }
        terminalCloseBtn.addEventListener("click", () => {
            terminalWindow.style.display = "none";
            if(terminalMaximized){
                taskbar.classList.remove("solid");
                terminalMaximized = false;
            }
            terminalWindow.style.display = "none";
            removeTerminalFromTaskbar();
        });
        terminalMinBtn.addEventListener("click", () => {
            terminalWindow.style.display = "none";
            if(!document.getElementById("taskbar-terminal")) addTerminalToTaskbar();
        });
        terminalMaxBtn.addEventListener("click", () => {
            if(!terminalMaximized){
                terminalPrevState  = {
                    width: terminalWindow.style.width,
                    height: terminalWindow.style.height,
                    left: terminalWindow.style.left,
                    top: terminalWindow.style.top
                };
                terminalWindow.style.width = "100vw";
                terminalWindow.style.height = "calc(100vh - 50px)";
                terminalWindow.style.left  = "0";
                terminalWindow.style.top = "0";
                terminalWindow.style.display = "flex";

                terminalWindow.classList.add("maximized");
                taskbar.classList.add("solid");
            }
            else{
                terminalWindow.style.width=terminalPrevState.width;
                terminalWindow.style.height=terminalPrevState.height;
                terminalWindow.style.left=terminalPrevState.left;
                terminalWindow.style.top=terminalPrevState.top;
                terminalWindow.style.display = "flex";
                terminalWindow.classList.remove("maximized");
                taskbar.classList.remove("solid");
            }
            terminalMaximized = !terminalMaximized;
        });
        
        //terminal taskbar managment
        function addTerminalToTaskbar() {
            const taskbarItems = document.getElementById("taskbar-items");
            if(document.getElementById("taskbar-terminal")) return;

            const item = document.createElement("button");
            item.id = "taskbar-terminal";
            item.style.cursor = "pointer";
            item.style.background = "none";
            item.style.border = "none";
            item.style.padding = "0";
            item.style.margin = "0 5px";

            const img = document.createElement("img");
            img.src="assets/terminal-icon.png";
            img.style.width="40px";
            img.style.height="40px";

            item.addEventListener("mouseenter", () => {
                item.style.background = "rgba(54,52,52,0.1)";
                item.style.borderRadius = "4px";
                item.style.border = "1px solid rgba(255,255,255,0.2)";
            });

            item.addEventListener("click", () => {
                if(terminalWindow.style.display === "none"){
                    terminalWindow.style.display = "flex";
                    if(terminalMaximized) taskbar.classList.add("solid");
                } else {
                    terminalWindow.style.display = "none";
                    if(terminalMaximized) taskbar.classList.remove("solid");
                }
            });

            item.addEventListener("mouseleave", () => {
                item.style.background = "none";
                item.style.border = "none";
            })

            item.appendChild(img);
            taskbarItems.appendChild(item);
        }
        function removeTerminalFromTaskbar(){
            const item = document.getElementById("taskbar-terminal");
            if(item)item.remove();
        }


        //Terminal functionality
        const terminalInput = document.getElementById("terminal-input");
        const terminalOutput = document.getElementById("terminal-output");
        const terminalContent = document.getElementById("terminal-content");

        let terminalHasRunOnce = false;

        terminalInput.addEventListener("keydown", (e) => {
            if (e.key !== "Enter") return;

            e.preventDefault();

            const command = terminalInput.value.trim();

            if (!terminalHasRunOnce) {
                terminalInput.placeholder = "";
                terminalHasRunOnce = true;
            }

            const commandLine = document.createElement("div");
            commandLine.textContent = `user@GenericOS~:$ ${command}`;
            terminalOutput.appendChild(commandLine);

            const responseLine = document.createElement("div");
            if (commands[command]) {
                responseLine.innerHTML = commands[command];
            } else {
                responseLine.textContent = "Command not found, run 'help' for a list of commands";
            }
            terminalOutput.appendChild(responseLine);

            terminalInput.value = "";
            terminalContent.scrollTop = terminalContent.scrollHeight;
        });
        //power menu functionality
        const powerButton = document.getElementById("power-button");
        const powerMenu = document.getElementById("power-menu");

        powerButton.addEventListener("click", () => {
            powerMenu.style.display = 
                powerMenu.style.display === "block"
                    ? "none"
                    : "block";
        });
        document.addEventListener("click", (e) =>{
            if(!powerButton.contains(e.target) && !powerMenu.contains(e.target)) {
                powerMenu.style.display = "none";
            }
        });
        const restartOption = document.querySelector(".power-option:last-child");
        const powerOffOption = document.querySelector(".power-option:first-child");

        restartOption.addEventListener("click", () => {
            window.location.reload();
        });
        powerOffOption.addEventListener("click", () =>{
            window.close();
            alert("Shutdown. (window close failed)");
        });
    </script>
</body>
</html>
