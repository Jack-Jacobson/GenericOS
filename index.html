<!DOCTYPE html>
<html>
<head>
    <title>OS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #desktop {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 20, 20, 0.489);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
        }
        #clock {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
        }
        #os-text {
            color: white;
            font-family: sans-serif;
            font-size: 14px;
        }
        #notepad-icon img {
            width: 60px;
            height: 60px;
            display: block;
            margin: 0 auto 5px auto;
        }
        #notepad-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            padding: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
        }
        #test-window {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            height: 150px;
            background: rgba(30,30,30,0.9);
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-family: sans-serif;
            cursor: grab;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="desktop">

        <div id="test-window"> 
            drag me
        </div>

        <div id="notepad-icon">
            <img src="assets/notepad-icon.png" />
            <div>Notepad</div>
        </div>


        <div id="taskbar">
            <div id="os-text">GenericOS</div>
            <div id="clock"></div>
        </div>
    </div>
    <script>
        //wallpaper
        document.getElementById("desktop").style.backgroundImage = "url('assets/wallpaper.jpeg')";
    
        //clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            let ampm = "AM";
            if(hours>=12){
                hours -= 12;
                ampm = "PM";
            } 

            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        
        }

        updateClock();
        setInterval(updateClock, 1000);

        //draggable window
        const testWindow = document.getElementById("test-window");

        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;

        testWindow.addEventListener("mousedown", (e) => {
            isDragging = true;
            offsetX = e.clientX - testWindow.offsetLeft;
            offsetY = e.clientY - testWindow.offsetTop;
            testWindow.style.cursor = "grabbing";
        });

        testWindow.addEventListener("mousemove", (e) => {
            if(isDragging){
                testWindow.style.left = `${e.clientX - offsetX}px`;
                testWindow.style.top = `${e.clientY - offsetY}px`;
            }
        });

        testWindow.addEventListener("mouseup", () => {
            isDragging = false;
            testWindow.style.cursor = "grab";
        });

    </script>
</body>
</html>
